<!DOCTYPE html>
<html>
<head>
    <style>
        /* General Styles */
        body {
            background-color: #107896;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #107896;
            padding: 10px 0;
            text-align: center;
        }
        nav {
            display: inline-flex;
            gap: 30px;
            justify-content: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 10px 20px;
        }
        nav a:hover {
            background-color: yellow;
            color: blue;
        }
        section {
            display: none;
            padding: 20px;
        }
        section.active {
            display: block;
        }

        /* Specific Styles for Edit State */
        
        #searchfield {
            position: relative;
            top: 40px; 
        }
        #dataentry {
            position: relative;
            top: 30px; 
        }
        h1 {
            font-family: Trebuchet ms, Verdana, Myriad Web, Syntax, sans-serif;
            color: white;
            margin-bottom: 5px;
            background-color: none;  
            margin-left: 450px; 
        }
        form {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: none;  
            border-radius: 8px;
        }
        .formfield {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 5px;
        }
        .leftcol {
            width: 180px;
            text-align: right;
            padding-right: 15px;
            font-weight: bold;
        }
        .buttonsec {
            display: flex;
            justify-content: space-between; 
            margin-right: 80px;
        }
        button {
            padding: 10px 15px;
            background-color: #444;
            color: white;
            border: none;
        }
        .buttonsec button:disabled {
            opacity: 0.5;
        }
        .disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .rightcol {
            color: red;
            text-align: left;
            margin-left: 10px; 
        }

        /* Styles for Generate Chart Tab */
        
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        //Navigation
        function tabs(pageId) {
            var sections = document.getElementsByTagName('section');
            for (var i = 0; i < sections.length; i++) {
                sections[i].classList.remove('active');
            }
            document.getElementById(pageId).classList.add('active');
        }


        function savebuttonfctn() {
            var foodandbev= document.getElementById('foodandbev').value;
            var gasandenergy= document.getElementById('gasandenergy').value;
            var healthcare= document.getElementById('healthcare').value;
            var housing= document.getElementById('housing').value;
            var other= document.getElementById('other').value;
            var errormsgs= false;

            if(foodandbev<0 || foodandbev === "") {
                document.getElementById('foodandbeverrormsg').innerHTML= "Must have a Food and Beverage greater than or equal to 0!";
                errormsgs = true;
            }else{
                document.getElementById('foodandbeverrormsg').innerHTML= "";
            }

            if(gasandenergy<0 || gasandenergy === "") {
                document.getElementById('gasandenergyerrormsg').innerHTML= "Must have a Gas and Energy greater than or equal to 0!";
                errormsgs = true;
            } else {
                document.getElementById('gasandenergyerrormsg').innerHTML= "";
            }

            if(healthcare<0 || healthcare === "") {
                document.getElementById('healthcareerrormsg').innerHTML= "Must have a Healthcare greater than or equal to 0!";
                errormsgs = true;
            } else {
                document.getElementById('healthcareerrormsg').innerHTML= "";
            }

            if(housing<0 || housing === "") {
                document.getElementById('housingerrormsg').innerHTML= "Must have a Housing greater than or equal to 0!";
                errormsgs = true;
            } else {
                document.getElementById('housingerrormsg').innerHTML= "";
            }

            if(other<0 || other === "") {
                document.getElementById('othererrormsg').innerHTML= "Must have a Other greater than or equal to 0!";
                errormsgs = true;
            } else {
                document.getElementById('othererrormsg').innerHTML= "";
            }

            var saveButton = document.getElementById('saveButton');
                if(errormsgs) {
                    saveButton.disabled = true;
                }else {
                    saveButton.disabled = false;
                }
            }


        function byabbreviationfuctn() {
            var stateabbrev=document.getElementById("stateabbrev").value;
            if(stateabbrev.length > 0) {
                var xhttp=new XMLHttpRequest();
                xhttp.onload = function() {
                    var data = JSON.parse(this.responseText);
                        
                    if(data){
                        if(data.success){
                            document.getElementById('abbrev').innerHTML = stateabbrev.toUpperCase();
                            document.getElementById('state').innerHTML = data.state;
                            document.getElementById('foodandbev').value = data.foodandbev;
                            document.getElementById('gasandenergy').value = data.gasandenergy;
                            document.getElementById('healthcare').value = data.healthcare;
                            document.getElementById('housing').value = data.housing;
                            document.getElementById('other').value = data.other;
                            document.getElementById('abbreverrormsg').innerHTML = ""; 
                            enabledisable('dataentry');
                        } else {
                            document.getElementById('abbreverrormsg').innerHTML = "No matching state!";
                        }
                    }
                };
                xhttp.open("GET", "search_state.php?abbreviation=" + stateabbrev, true);
                xhttp.send();
            }
        }

        function bystatenamefunct() {
        var statename = document.getElementById("statename").value;
        if (statename.trim().length > 0) {
        var xhttp = new XMLHttpRequest();
        xhttp.onload = function () {
            if (this.status === 200) {
                var data = JSON.parse(this.responseText);
                if (data && data.success) {
                    document.getElementById("abbrev").innerHTML = data.abbreviation ? data.abbreviation.toUpperCase() : "";
                    document.getElementById("state").innerHTML = data.state || "";
                    document.getElementById("foodandbev").value = data.foodandbev || "";
                    document.getElementById("gasandenergy").value = data.gasandenergy || "";
                    document.getElementById("healthcare").value = data.healthcare || "";
                    document.getElementById("housing").value = data.housing || "";
                    document.getElementById("other").value = data.other || "";
                    document.getElementById("abbreverrormsg").innerHTML = "";

                    enabledisable("dataentry");
                } else {
                    document.getElementById("abbreverrormsg").innerHTML = "No matching state found!";
                    enabledisable("searchfield");
                }
            } else {
                document.getElementById("abbreverrormsg").innerHTML = "Error fetching state data.";
            }
        };

        xhttp.onerror = function () {
            document.getElementById("abbreverrormsg").innerHTML = "Please try again.";
        };

        xhttp.open("GET", "search_state.php?statename=" + statename, true);
        xhttp.send();
    } else {
        document.getElementById("abbreverrormsg").innerHTML = "Please enter a state name.";
    }
}

        function cancelfunct() {
            if (confirm("Really want to cancel?")) {
                document.getElementById('abbrev').innerHTML = '';
                document.getElementById('state').innerHTML = '';
                document.getElementById('foodandbev').value = '';
                document.getElementById('gasandenergy').value = '';
                document.getElementById('healthcare').value = '';
                document.getElementById('housing').value = '';
                document.getElementById('other').value = '';
        
                enabledisable('searchfield');
            }
        }

        function enabledisable(enableform) {
            var searcharea = document.getElementById('searchfield');
            var dataentryarea = document.getElementById('dataentry');
            if (enableform === 'dataentry') {
                searcharea.classList.add('disabled');
                dataentryarea.classList.remove('disabled');
            } else {
                dataentryarea.classList.add('disabled');
                searcharea.classList.remove('disabled');
            }
        }

        function statelistfunct() {
            var xhttp = new XMLHttpRequest();
                xhttp.onload = function() {
                    var states = JSON.parse(this.responseText);
                    var statedatalist = document.getElementById("stateList");
                    statedatalist.innerHTML = "";  
                for (var i = 0; i < states.length; i++) {
                    var option = document.createElement("option");
                    option.value = states[i];
                    statedatalist.appendChild(option);
                }
        };
        xhttp.open("GET", "statesdata.php", true);
        xhttp.send();
        }
        

        function savebtn(event) {
            event.preventDefault(); 
            
            var data = {
                    abbreviation: document.getElementById("abbrev").textContent,
                    state: document.getElementById("state").textContent,
                    foodandbev: document.getElementById("foodandbev").value,
                    gasandenergy: document.getElementById("gasandenergy").value,
                    healthcare: document.getElementById("healthcare").value,
                    housing: document.getElementById("housing").value,
                    other: document.getElementById("other").value,
            };

            var xhttp = new XMLHttpRequest();
            xhttp.onload = function() {
            
            var response = JSON.parse(this.responseText);
            if (response.success) {
                alert("Data saved successfully!");
                document.getElementById('abbrev').textContent = '';
                document.getElementById('state').textContent = '';
                document.getElementById('foodandbev').value = '';
                document.getElementById('gasandenergy').value = '';
                document.getElementById('healthcare').value = '';
                document.getElementById('housing').value = '';
                document.getElementById('other').value = '';
                document.getElementById('saveButton').disabled = true;
                tabs('searchfield');
            } else {
                alert("Error while saving data: " + response.error);
            }
        };

            xhttp.open("POST", "save_state.php", true);
            xhttp.send(JSON.stringify(data)); 
    }

        
        window.onload = function () {
            statelistfunct();
            tabs('editstate');
            droppdowns();
        };



<!-- Chart -->

        
    </script>
</head>

<body >
    <header>
        <nav>
            <a href="javascript:void(0);" onclick="tabs('editstate')">Edit State</a>
            <a href="javascript:void(0);" onclick="tabs('generatechart')">Generate Chart</a>
        </nav>
        <hr>
    </header>
    <main>
        <!-- Edit State Tab -->
        <section id="editstate" class="active">
            <div id="searchfield">
        <h1>Search</h1>
        <form>
            <div class="formfield">
                <div class="leftcol">By Abbreviation:</div>
                <div class="middlecol">
                    <input type="text" id="stateabbrev" style="width: 50px;" oninput="byabbreviationfuctn()" />
                </div>
                <div class="rightcol" id="abbreverrormsg"></div>
            </div>

            <div class="formfield" id="stateNameContainer">
                <div class="leftcol">By State Name:</div>
                <div class="middlecol">
                    <input type="text" id="statename" list="stateList"  oninput="bystatenamefunct()" />
                    <datalist id="stateList"></datalist>
                </div>
            </div>
        </form>
    </div><br><br>
<hr>
    
    <div id="dataentry" class="disabled">
        <h1>Data Entry</h1>
        <form onsubmit="savebtn(event)" >
            <div class="formfield">
                <div class="leftcol">Abbrev:</div>
                <div class="middlecol"><span id="abbrev"></span></div>
            </div>

            <div class="formfield">
                <div class="leftcol">State:</div>
                <div class="middlecol"><span id="state"></span></div>
            </div>

            <div class="formfield">
                <div class="leftcol">
                    <label for="foodandbev">Food and Beverage:</label>
                </div>
                <div class="middlecol">
                    <input type="number" id="foodandbev" name="foodandbev" oninput="savebuttonfctn()" min="0" required/> 
                </div>
                <div class="rightcol" id="foodandbeverrormsg"></div>
            </div>

            <div class="formfield">
                <div class="leftcol">
                    <label for="gasandenergy">Gas and Energy:</label>
                </div>
                <div class="middlecol">
                    <input type="number" id="gasandenergy" name="gasandenergy"  oninput="savebuttonfctn()" min="0" required/>
                </div>
                <div class="rightcol" id="gasandenergyerrormsg"></div>
            </div>

            <div class="formfield">
                <div class="leftcol">
                    <label for="healthcare">Healthcare:</label>
                </div>
                <div class="middlecol">
                    <input type="number" id="healthcare" name="healthcare"  oninput="savebuttonfctn()" min="0" required/>
                </div>
                <div class="rightcol" id="healthcareerrormsg"></div>
            </div>

            <div class="formfield">
                <div class="leftcol">
                    <label for="housing">Housing and Utilities:</label>
                </div>
                <div class="middlecol">
                    <input type="number" id="housing" name="housing"  oninput="savebuttonfctn()" min="0" required/>
                </div>
                <div class="rightcol" id="housingerrormsg"></div>
            </div>

            <div class="formfield">
                <div class="leftcol">
                    <label for="other">Other:</label>
                </div>
                <div class="middlecol">
                    <input type="number" id="other" name="other"  oninput="savebuttonfctn()" min="0" required/>
                </div>
                <div class="rightcol" id="othererrormsg"></div>
            </div>            

            <div class="buttonsec">
                <button type="button" onclick="cancelfunct()">Cancel</button>
                <button type="submit" id="saveButton" disabled>Save</button>
            </div>
        </form>
    </div>
        </section>



        <!-- Generate Chart Tab -->
        
    </main>
</body>
</html>
