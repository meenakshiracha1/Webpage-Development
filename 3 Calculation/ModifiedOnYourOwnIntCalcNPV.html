<!doctype html>
<html>
    <head>
        <style>
            .leftcol{
                display: inline-block;
                font-weight:bold;
                width:150px;
                text-align:right;
            }
            .rightcol{
                display:inline-block;
            }
            .checkarea {
                display: inline-block;
                font-size: large;
            }
        </style>
        <script> 
        function checkNumericInput() {
      const inputElement = document.getElementById('ProjectCost');
      const inputElement = document.getElementById('RecurringBenefit');
      const inputElement = document.getElementById('RecurringCost');
      const inputElement = document.getElementById('InterestRate');
      const buttonElement = document.getElementById('button');
      const inputValue = parseFloat(inputElement.value);

      if (!isNaN(inputValue) && inputValue > 0) {
        buttonElement.disabled = false;
      } else {
        buttonElement.disabled = true;
      }
    }
        
        </script>
    </head>
    <body >
        <form>
            <div class="leftcol">
                <label for="ProjectCost">Project Cost:</label>
            </div>
            <div class="rightcol">
                <input type="text" id="ProjectCost" onkeyup="checkNumericInput()">
            </div><br />
            
            
            <div class="leftcol">
                <label for="RecurringBenefit">Recurring Benefit:</label>
            </div>
            <div class="rightcol">
                <input type="text" id="RecurringBenefit" onkeyup="checkNumericInput()">
            </div><br />
            
            
            <div class="leftcol">
                <label for="RecurringCost">Recurring Cost:</label>
            </div>
            <div class="rightcol">
                <input type="text" id="RecurringCost" onkeyup="checkNumericInput()">
            </div><br />
            
            
            <div class="leftcol">
                <label for="InterestRate">Interest Rate:</label>
            </div>
            <div class="rightcol">
                <input type="text" id="InterestRate" style="width: 85px;"/><br/>
            </div>
            <div class="checkarea">
                <span id="percentage">%</span>
            </div><br />
            
            <!--For Button-->
            <div class="leftcol">
                <label for=""></label>
            </div>
            <div class="rightcol">
                <button id="button" onclick="replace(textinput)" disabled>Calculate</button>
            </div><br/>
            <!--Button end-->
            
            <div class="leftcol">
                <label for="NPVBreakeven">NPV Breakeven:</label>
            </div><br />
            <table border="1">
                <thead>
                    <tr>
                        <th colspan="7">Working</th>
                    </tr>
                    <tr>
                        <th>Year</th>
                        <th>Previous Year Debt</th>
                        <th>New Cost</th>
                        <th>NPV New Cost</th>
                        <th>New Benefit</th>
                        <th>NPV New Benefit</th>
                        <th>Debt End of Year</th>
                    </tr>
                </thead>
                <tbody id="changehere">
                    
                </tbody>
            </table>
        </form>
    </body>
</html>
